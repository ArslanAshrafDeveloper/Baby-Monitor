name: Android APK

# Builds the React Native Android app and uploads the APK as a workflow artifact.
#
# Triggers:
#   - on every push / PR: builds a debug APK
#   - on a tag like v0.1.0:  also builds a release APK if signing secrets are present
#
# Required repo secrets (only for signed release builds):
#   ANDROID_KEYSTORE_BASE64   base64-encoded keystore (.keystore or .jks)
#   ANDROID_KEYSTORE_PASSWORD store password
#   ANDROID_KEY_ALIAS         key alias inside the keystore
#   ANDROID_KEY_PASSWORD      key password
#
# Generate the base64 with:
#   base64 -w 0 baby-monitor-release.keystore   # Linux
#   base64 -i  baby-monitor-release.keystore    # macOS

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  RN_VERSION: 0.74.3
  NODE_VERSION: 20.x
  JAVA_VERSION: '17'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # NOTE: caching disabled until a package-lock.json exists in app/.
          # Re-enable once you've committed app/package-lock.json:
          #   cache: 'npm'
          #   cache-dependency-path: app/package-lock.json

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Python (for YAMNet download)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ml/tools/requirements.txt

      # ---------------------------------------------------------------------
      # JS deps
      # ---------------------------------------------------------------------
      - name: Install JS deps
        working-directory: app
        run: npm install --no-audit --no-fund

      # ---------------------------------------------------------------------
      # Generate the native android/ project (we don't commit it).
      # The CLI scaffolds a fresh template; we only keep its android/ folder.
      # ---------------------------------------------------------------------
      - name: Scaffold native android project
        run: |
          if [ ! -d app/android ]; then
            npx --yes @react-native-community/cli init BabyMonitorNative \
              --version ${{ env.RN_VERSION }} \
              --skip-install \
              --skip-git-init \
              --directory app-tmp
            mv app-tmp/android app/android
            rm -rf app-tmp
          fi

      - name: Patch AndroidManifest.xml (permissions + foreground service)
        run: |
          MANIFEST=app/android/app/src/main/AndroidManifest.xml
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("app/android/app/src/main/AndroidManifest.xml")
          src = p.read_text()
          perms = """
          <uses-permission android:name="android.permission.INTERNET" />
          <uses-permission android:name="android.permission.RECORD_AUDIO" />
          <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
          <uses-permission android:name="android.permission.WAKE_LOCK" />
          <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
          <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
          <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />
          <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
          """
          if "RECORD_AUDIO" not in src:
              src = src.replace("<application", perms + "\n  <application", 1)
          if "FOREGROUND_SERVICE_MICROPHONE" not in src:
              src = src.replace(
                  "</application>",
                  '  <service android:name="com.voziv.foregroundservice.ForegroundService" '
                  'android:foregroundServiceType="microphone" android:exported="false" />\n</application>',
              )
          p.write_text(src)
          PY

      - name: Patch root build.gradle (NDK + dependency pins)
        run: |
          python3 - <<'PY'
          import pathlib, re
          p = pathlib.Path("app/android/build.gradle")
          src = p.read_text()

          # 1. Make sure NDK version is pinned.
          if "ndkVersion" not in src:
              src = re.sub(
                  r'(buildToolsVersion\s*=\s*"[^"]*")',
                  r'\1\n        ndkVersion = "26.1.10909125"',
                  src, count=1,
              )

          # 2. Pin androidx.core / core-ktx to versions compatible with compileSdk 34.
          # androidx.core:core 1.16.0+ requires compileSdk 35 + Android Gradle Plugin 8.3+,
          # but the RN 0.74.3 template ships with AGP 8.2.1 (cap = compileSdk 34).
          # Same for androidx.activity (1.10+ also requires compileSdk 35).
          pin_block = """

          // ---- Auto-injected by CI: dependency pins for compileSdk 34 -------------
          subprojects {
              configurations.all {
                  resolutionStrategy.eachDependency { details ->
                      def req = details.requested
                      if (req.group == "androidx.core" && (req.name == "core" || req.name == "core-ktx")) {
                          details.useVersion "1.13.1"
                          details.because "AGP 8.2.x caps compileSdk at 34"
                      }
                      if (req.group == "androidx.activity" && req.name == "activity") {
                          details.useVersion "1.9.3"
                          details.because "AGP 8.2.x caps compileSdk at 34"
                      }
                      if (req.group == "androidx.fragment" && req.name == "fragment") {
                          details.useVersion "1.8.4"
                          details.because "AGP 8.2.x caps compileSdk at 34"
                      }
                  }
              }
          }
          // ------------------------------------------------------------------------
          """
          if "Auto-injected by CI" not in src:
              src += pin_block

          p.write_text(src)
          PY

      # ---------------------------------------------------------------------
      # Cache Gradle dependencies between runs.
      # ---------------------------------------------------------------------
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            app/android/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('app/android/**/*.gradle*', 'app/android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # ---------------------------------------------------------------------
      # Download YAMNet so the bundled JS can find it (the detector falls back
      # to a heuristic without it, but a real APK should ship the model).
      # ---------------------------------------------------------------------
      - name: Download YAMNet model
        working-directory: ml
        run: |
          python -m pip install -r tools/requirements.txt
          python tools/download_yamnet.py
          mkdir -p ../app/assets/models
          cp models/yamnet.tflite ../app/assets/models/yamnet.tflite

      # ---------------------------------------------------------------------
      # Debug APK — always built.
      # ---------------------------------------------------------------------
      - name: Build debug APK
        working-directory: app/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # ---------------------------------------------------------------------
      # Release APK — only on tags, and only when signing secrets are present.
      # ---------------------------------------------------------------------
      - name: Decode keystore
        if: startsWith(github.ref, 'refs/tags/v') && env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/android/app/baby-monitor-release.keystore
          ls -la app/android/app/baby-monitor-release.keystore

      - name: Build release APK
        if: startsWith(github.ref, 'refs/tags/v') && env.ANDROID_KEYSTORE_BASE64 != ''
        working-directory: app/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          BABY_MONITOR_RELEASE_STORE_FILE: baby-monitor-release.keystore
          BABY_MONITOR_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BABY_MONITOR_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BABY_MONITOR_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload release APKs
        if: startsWith(github.ref, 'refs/tags/v') && env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
